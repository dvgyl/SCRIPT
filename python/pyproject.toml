[project]
name = "scriptkin"
version = "0.1.0"
description = "Read, check, and measure drawing kinematics recorded by SCRIPT Capture and public pen-tablet datasets."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
]

[project.scripts]
scriptkin = "scriptkin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptkin"]

[tool.ruff]
line-length = 110
extend-exclude = ["**/._*"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
venvPath = "../build"
venv = "venv"
include = ["src", "tests"]
exclude = ["**/._*"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
